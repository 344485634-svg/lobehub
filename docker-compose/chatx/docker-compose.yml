name: chatx

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: chatx/app:latest
    container_name: chatx-app
    restart: always
    # 与 rustfs 共享 chatx-net 的网络命名空间:
    # 应用侧 S3_ENDPOINT 与浏览器看到的地址同为 http://localhost:9000,
    # 预签名 URL 的签名主机名与实际访问主机名一致,直传才能成功。
    network_mode: 'service:chatx-net'
    environment:
      - DATABASE_DRIVER=node
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@chatx-postgres:5432/chatx
      - KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUSTED_ORIGINS=http://localhost:${CHATX_PORT}
      - APP_URL=http://localhost:${CHATX_PORT}
      - INTERNAL_APP_URL=http://localhost:3210
      # 商业功能总开关:订阅/账单/积分/推荐/用量/通知页 + 生图视频积分计费
      - ENABLE_BUSINESS_FEATURES=1
      - REDIS_URL=redis://chatx-redis:6379
      - REDIS_PREFIX=chatx
      - REDIS_TLS=0
      # OIDC 签名密钥(生成图片/视频的异步任务启动需要)
      - JWKS_KEY=${JWKS_KEY}
      # S3:应用与浏览器必须使用同一可达地址
      - S3_ENDPOINT=http://localhost:${RUSTFS_API_PORT}
      - S3_BUCKET=${RUSTFS_CHATX_BUCKET}
      - S3_ENABLE_PATH_STYLE=1
      - S3_PUBLIC_DOMAIN=http://localhost:${RUSTFS_API_PORT}
      - S3_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - S3_SET_ACL=0
      - NEXT_PUBLIC_S3_DOMAIN=http://localhost:${RUSTFS_API_PORT}
      - LLM_VISION_IMAGE_USE_BASE64=1
      - SEARXNG_URL=http://chatx-searxng:8080
    depends_on:
      chatx-net:
        condition: service_started
      chatx-postgres:
        condition: service_healthy
      chatx-redis:
        condition: service_healthy
      chatx-rustfs-init:
        condition: service_completed_successfully

  # 稳定的网络命名空间宿主:持有 3210(app)/9000(rustfs API)/9001(console) 的端口发布。
  # app 与 rustfs 挂到它的 netns 下,因此互不影响生命周期。
  chatx-net:
    image: alpine
    container_name: chatx-net
    restart: always
    command: tail -f /dev/null
    ports:
      - '${CHATX_PORT}:3210' # ChatX Web
      - '${RUSTFS_API_PORT}:9000' # RustFS S3 API(应用与浏览器共用)
      - '${RUSTFS_CONSOLE_PORT}:9001' # RustFS Console
    networks:
      - chatx-network

  chatx-postgres:
    image: paradedb/paradedb:latest-pg17
    container_name: chatx-postgres
    command: ['postgres', '-c', 'shared_preload_libraries=pg_search']
    ports:
      - '${POSTGRES_PORT}:5432' # host access for debugging
    environment:
      - POSTGRES_DB=chatx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - chatx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always
    networks:
      - chatx-network

  chatx-redis:
    image: redis:7-alpine
    container_name: chatx-redis
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - chatx_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always
    networks:
      - chatx-network

  chatx-rustfs:
    image: rustfs/rustfs:latest
    container_name: chatx-rustfs
    # 共享 chatx-net 的网络命名空间(端口发布由 chatx-net 承担)
    network_mode: 'service:chatx-net'
    command:
      [
        '--access-key',
        '${RUSTFS_ACCESS_KEY}',
        '--secret-key',
        '${RUSTFS_SECRET_KEY}',
        '/data',
      ]
    environment:
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - chatx_rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
    depends_on:
      chatx-net:
        condition: service_started

  chatx-rustfs-init:
    # minio/mc 已被 Docker Hub/quay/registry.min.io 全线限制匿名拉取,改用 aws-cli
    image: amazon/aws-cli:latest
    container_name: chatx-rustfs-init
    depends_on:
      chatx-rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./bucket.policy.json:/bucket.policy.json:ro
      - ./bucket.cors.json:/bucket.cors.json:ro
    entrypoint: /bin/sh
    # rustfs 与 app 共享 chatx-net 的 netns,经 chatx-net 名称可达
    command: -c '
        set -x;
        aws --endpoint-url http://chatx-net:9000 s3api create-bucket --bucket "${RUSTFS_CHATX_BUCKET}" || true;
        aws --endpoint-url http://chatx-net:9000 s3api put-bucket-policy --bucket "${RUSTFS_CHATX_BUCKET}" --policy file:///bucket.policy.json || true;
        aws --endpoint-url http://chatx-net:9000 s3api put-bucket-cors --bucket "${RUSTFS_CHATX_BUCKET}" --cors-configuration file:///bucket.cors.json || true;
        aws --endpoint-url http://chatx-net:9000 s3api list-buckets;
        echo "bucket ${RUSTFS_CHATX_BUCKET} ready";
      '
    restart: 'no'
    networks:
      - chatx-network

  chatx-searxng:
    image: searxng/searxng:latest
    container_name: chatx-searxng
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml
    restart: always
    networks:
      - chatx-network

volumes:
  chatx_pgdata:
    driver: local
  chatx_redis_data:
    driver: local
  chatx_rustfs_data:
    driver: local

networks:
  chatx-network:
    driver: bridge
